<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Especial de Formatura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      padding: 20px;
    }
    .portal-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 24px;
    }
    .btn-portal {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .btn-emanuel {
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #0f172a;
    }
    .btn-rosangela {
      background: linear-gradient(135deg, #e28b8b, #a83256);
      color: #ffffff;
    }
    .btn-portal:hover { transform: translateY(-2px); filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="portal-card">
    <p class="badge">Comissão de Formatura</p>
    <h1>Uma Mensagem Especial da Turma</h1>
    <a href="emanuel.html" class="btn-portal btn-emanuel">Acessar: Professor Emanuel</a>
    <a href="rosangela.html" class="btn-portal btn-rosangela">Acessar: Professora Rosângela</a>
  </div>
</body>
</html>
